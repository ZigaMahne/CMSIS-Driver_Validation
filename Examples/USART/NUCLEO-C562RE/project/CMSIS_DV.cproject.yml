# yaml-language-server: $schema=https://raw.githubusercontent.com/Open-CMSIS-Pack/devtools/schemas/projmgr/2.11.0/tools/projmgr/schemas/cproject.schema.json
project:
  processor:
    trustzone: off
    dsp: on
  rte:
    base-dir: $ProjectDir()$/user_modifiable
  generators:
    base-dir: generated
  output:
    base-name: $Project$
    type:
      - elf
      - bin
      - hex
  setups:
    - setup: debug_AC6
      misc:
        - ASM:
            - -g
            - -O0
          C:
            - -g
            - -O0
            - -std=gnu11
            - -fno-exceptions
            - -fno-rtti
            - -funsigned-char
            - -Wmissing-prototypes
          CPP:
            - -g
            - -O0
            - -std=gnu++14
            - -fno-exceptions
            - -fno-rtti
            - -funsigned-char
            - -Wmissing-prototypes
          for-compiler: AC6
          Link-C:
            - --map
            # - --library_type=microlib
            - --symbols
            - --show_full_path
            - --inline
            - --any_contingency
          Link-CPP:
            # - --library_type=microlib
            - --symbols
            - --map
            - --show_full_path
            - --inline
            - --any_contingency
      for-context:
        - .debug_AC6
  components:
    - component: STMicroelectronics::CMSIS:CORE@6.2.0
    - component: STMicroelectronics::Device:Startup@2.1.0
    - component: STMicroelectronics::Device:STM32 HAL:Core@2.0.0
    - component: STMicroelectronics::Device:STM32 HAL:CORTEX@2.0.0
    - component: STMicroelectronics::Device:STM32 HAL:DMA@2.1.0
    - component: STMicroelectronics::Device:STM32 HAL:FLASH_ITF@2.1.0
    - component: STMicroelectronics::Device:STM32 HAL:GPIO@2.1.0
    - component: STMicroelectronics::Device:STM32 HAL:ICACHE@2.1.0
    - component: STMicroelectronics::Device:STM32 HAL:PWR@2.0.1
    - component: STMicroelectronics::Device:STM32 HAL:Q@2.0.0
    - component: STMicroelectronics::Device:STM32 HAL:RCC@2.0.0
    - component: STMicroelectronics::Device:STM32 HAL:TIM@2.0.1
    - component: STMicroelectronics::Device:STM32 HAL:TIM timebase template@2.0.0
    - component: STMicroelectronics::Device:STM32 HAL:timebases&TIM@2.0.0
    - component: STMicroelectronics::Device:STM32 HAL:UART@2.0.1
    - component: STMicroelectronics::Device:STM32 LL:BUS@2.0.1
    - component: STMicroelectronics::Device:STM32 LL:Common@2.0.0
    - component: STMicroelectronics::Device:STM32 LL:DMA@2.1.0
    - component: STMicroelectronics::Device:STM32 LL:EXTI@2.1.0
    - component: STMicroelectronics::Device:STM32 LL:FLASH@2.1.0
    - component: STMicroelectronics::Device:STM32 LL:GPIO@2.1.0
    - component: STMicroelectronics::Device:STM32 LL:ICACHE@2.0.0
    - component: STMicroelectronics::Device:STM32 LL:PWR@2.0.0
    - component: STMicroelectronics::Device:STM32 LL:RCC@2.0.0
    - component: STMicroelectronics::Device:STM32 LL:SBS@2.0.0
    - component: STMicroelectronics::Device:STM32 LL:TIM@2.1.0
    - component: STMicroelectronics::Device:STM32 LL:USART@2.0.0
    - component: STMicroelectronics::Device:STM32 LL:UTILS@2.0.0
    - component: STMicroelectronics::Device:STM32CubeMX2 Codegen:Generated Code@2.0.0
    - component: Device:STM32CubeMX2 Config:CORE
    - component: Device:STM32CubeMX2 Config:CORTEX MPU
    - component: Device:STM32CubeMX2 Config:CORTEX NVIC
    - component: Device:STM32CubeMX2 Config:ICACHE
    - component: Device:STM32CubeMX2 Config:RCC
    - component: Device:STM32CubeMX2 Config:System
    - component: Device:STM32CubeMX2 Config:TIM
    - component: Device:STM32CubeMX2 Config:UART
    - component: Utility:STM32CubeMX2 Config:syscalls
    - component: STMicroelectronics::Utility:syscalls&Standalone syscalls@1.0.0
    - component: STMicroelectronics::Utility:sysmem&Standalone sysmem@1.0.0
    - component: CMSIS Driver Validation:Framework
    - component: CMSIS-Compiler:CORE
    - component: CMSIS:RTOS2:Keil RTX5&Source
    - component: CMSIS:OS Tick:SysTick
    - component: CMSIS Driver:USART
    - component: CMSIS-Compiler:STDERR:Custom
    - component: CMSIS-Compiler:STDIN:Custom
    - component: CMSIS-Compiler:STDOUT:Custom
    - component: CMSIS Driver Validation:USART
  groups:
    - files:
        - file: main.c
          category: source
        - file: main.h
          category: header
        - file: app_main.c
          category: source
        - file: app_main.h
          category: header
        - file: retarget_stdio.c
          category: source
        - file: MX_Device.h
          category: header
      group: UserCode
  define:
    # - STM32_HAL_VERSION_2
    - mx_usart1_hal_uart_gethandle: mx_usart1_uart_gethandle
    - mx_usart2_hal_uart_gethandle: mx_usart2_uart_gethandle
  add-path:
    - ./
  packs:
    - pack: ARM::CMSIS-Compiler
    - pack: ARM::CMSIS-Driver_Validation
    - pack: ARM::CMSIS-RTX
    - pack: STMicroelectronics::CMSIS@6.3.0
    - pack: ARM::CMSIS-Driver_STM32
